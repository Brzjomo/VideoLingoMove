version: "3.0.4"
api:
  key: 'YOUR_API_KEY'
  base_url: 'https://api.deepseek.com'
  model: 'deepseek-flash'

deepseek_api:
  key: 'YOUR_DEEPSEEK_API_KEY'
  base_url: 'https://api.deepseek.com'
  model: 'deepseek-flash'

qwen_api:
  key: 'YOUR_QWEN_API_KEY'
  base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
  model: 'qwen-plus'

siliconflow_api:
  key: 'YOUR_SILICONFLOW_API_KEY'
  base_url: 'https://api.siliconflow.cn'
  model: 'Qwen/Qwen2.5-72B-Instruct'

ollama_api:
  key: 'null'
  base_url: 'http://localhost:11434'
  model: 'qwen3:30b-a3b'

# Language settings, written into the prompt, can be described in natural language
target_language: '简体中文'
# 只生成原语言字幕，跳过翻译。注意此处**只能出现一次**：
# 曾经同时写了 true 和 false 两行，YAML 后键覆盖前键，语义完全靠顺序决定。
transcription_only: false
# Whether to use the LLM to optimize sentence splitting (step3_2 by meaning, step5 for long lines).
# true  = Netflix 标准的按意群断句（质量更好，会消耗 LLM token）
# false = 只用 spaCy 结果 + 标点就近断开（零 LLM 调用，断行略生硬）
# 注意：关闭后「翻译」相关的 LLM 调用不受影响，只是不做断句优化。
llm_sentence_split: true
asr_engine: 'whisper'
demucs: false
whisper:
  # ["medium", "large-v3", "large-v3-turbo"]. Note: for zh model will force to use Belle/large-v3
  model: 'large-v3'
  # Whisper specified recognition language [en, zh, ...] (empty or 'auto' for automatic detection)
  language: 'zh'
  detected_language: 'zh'
  # 留空 = 按语种自动给一句**中性**、带标点的示例（ja「こんにちは。今日はいい天気ですね。」等）。
  # 目的只是让 Whisper 输出**带标点**：实测留空时日语 6 分钟只出 27 个「。」，
  # 下游断句没有边界可用 → 只能按宽度硬切，一句话被劈成两条（见 core/subtitle_split.py）。
  # 想让 ASR 完全不受影响就把它设成 "none"（= 旧行为，输出不带标点）。
  initial_prompt: ''

# Volcano Engine ASR configuration
volcano_asr:
  # App ID from Volcano Engine console
  app_id: 'YOUR_VOLCANO_APP_ID'
  # Access token from Volcano Engine console
  access_token: 'YOUR_VOLCANO_ACCESS_TOKEN'
  # Resource ID, default: "volc.bigasr.auc"
  resource_id: 'volc.bigasr.auc'
  # Language code (optional, auto-detect if empty)
  # en-US, ja-JP, id-ID, es-MX, pt-BR, de-DE, fr-FR, ko-KR, fil-PH, ms-MY, th-TH, ar-SA
  language: 'zh-CN'
  # Enable punctuation
  enable_punc: false
  # Enable ITN (text normalization)
  enable_itn: true
  # Enable DDC (semantic smoothing)
  enable_ddc: true
  # Enable speaker info (speaker diarization)
  enable_speaker_info: false
  # Show utterances with timestamps
  show_utterances: true
  # Enable channel split for stereo audio
  enable_channel_split: false
  # Use VAD segmentation
  vad_segment: false
  # Model version: "310" (default) or "400" (improved performance)
  model_version: '400'

# TOS (Volcano Engine Object Storage) configuration
tos:
  # Access Key from Volcano Engine console
  access_key: 'YOUR_TOS_ACCESS_KEY'
  # Secret Key from Volcano Engine console
  secret_key: 'YOUR_TOS_SECRET_KEY'
  # Endpoint for TOS service
  endpoint: 'tos-cn-shanghai.volces.com'
  # Region for TOS service
  region: 'cn-shanghai'
  # Bucket name
  bucket_name: 'lingo'
  # Whether to enable TOS upload (if false, will use file:// URLs)
  enabled: true
  # Public URL prefix (auto-generated if empty)
  public_url_prefix: ''
  # Auto cleanup uploaded files after ASR completion
  auto_cleanup: true

# Video resolution [0x0, 640x360, 1920x1080]  0x0 will generate a 0-second black video placeholder
resolution: '0x0'
ytb_resolution: '1080'

# YouTube 下载设置
youtube:
  # 需要登录 / 年龄限制 / 会员视频：填 Netscape 格式 cookies.txt 的路径（留空表示不用）
  cookies_path: ''
  # 代理。留空字符串 = 显式禁用代理（环境里有 HTTP_PROXY 时有用）；
  # 删除本行或写 null = 交给 yt-dlp 按系统/环境变量自动发现；填 URL = 强制使用该代理
  proxy: null

subtitle:
  # 按语言自动设置字幕长度（推荐开启）：
  #   开 = 切「识别语言」/改「目标语言」时按语言档位覆盖下面两个值，且**运行期按当前语言现算**
  #        —— 下面两个值只是"当前语言的落盘副本"，手改无效（要手填请先关掉本开关）
  #   关 = 完全按手填值走（单一 max_length：源文按字符数、译文按宽度×target_multiplier），切换语言不改动
  # 档位表（单行上限按显示宽度：中日 1.75/韩 1.5/其余 1；粗切单位=词）见 core/subtitle_limits.py：
  #   中文/日文 60 宽度（≈34 字/行）、韩文 48（32 字）、英文等拉丁 70（70 字符）、俄语/RTL 65、泰语 65；兜底 70
  #   另留 15% 宽容量：只超一点点不切（为 1~2 个字符把一句话拆成两条字幕，观感更差）
  #   ⚠️ 这几个值是"**整句优先**"校准出来的（2026-09-20 两次实战回修：
  #      按 Netflix 的 12–16 字/行取 26 → 一句话被切 2~3 条；取 42 → 45~80 宽度的句子仍在切）
  #   想更松/更严：用下面的 length_profiles 覆盖，或干脆关掉本开关手填
  auto_length_by_language: true
  # *Maximum length of each subtitle line in characters
  # 自动模式下由档位表决定（这里显示的是当前语言的值）；手动模式下才真正生效
  max_length: 60
  # *Translated subtitles are slightly larger than source subtitles, affecting the reference length for subtitle splitting
  # 仅手动模式使用；自动模式两侧各按自己语言的档位，不再乘这个系数
  target_multiplier: 1.2
  # *字幕对齐兜底策略：warn=精确匹配失败时模糊兜底并告警（推荐）；strict=精确匹配失败即报错
  align_on_mismatch: warn
  # 可选：覆盖内置档位表（键=语言码，只认下面两个字段），单位=显示宽度/词
  # length_profiles:
  #   zh: {max_length: 52, max_split_length: 28}   # 想让中文一行更长
  #   en: {max_length: 70, max_split_length: 24}
  # 切点允许偏离"理想宽度位置"的比例：在这窗口内**优先挑句法边界**（标点 → 日语接续/助词），
  # 让一条字幕是完整意群而不是"半句"。0.15 与宽容量一致（更大反而会在下一轮被再切一刀）。
  boundary_window: 0.15
  # 极短字幕合并：停留时间短到看不清（默认 < 0.8 s；Netflix 规定最短 5/6 s ≈ 0.83 s）
  # 就并入相邻字幕 —— "哦 / 是的 / 原来如此"这类一闪而过的短句（2026-09-20 用户要求）。
  # 护栏：合并后不许超过 上限×1.15、两条间隔不许超过 merge_max_gap，否则保持原样。
  merge_short_cues: true
  short_cue_min_duration: 0.8
  merge_max_gap: 0.35
  # 原文行是否也去掉标点（默认 false = 保留，日语字幕本来就用 、。；标点只影响显示，
  # 断句在 step3/step5 早就用过了）
  strip_punctuation_in_source: false
  # 校验 LLM 的"译文对齐"结果（默认 true）：段数必须与源文一致、每段非空、**拼接必须逐字等于
  # 整句译文**（重复连接词/漏词/改写一律拦下）、不许留孤立碎片。校验不过会让模型自纠重试，
  # 仍不过就退回机械等分（拼接一定等于原文）。关掉 = 回到"允许模型对齐时改写"的旧行为。
  align_validate: true
  # 出口守卫（默认 true）：不许把词切开。step3_1 是**纯规则切分、没有提示词**，
  # 2026-09-20 实测它把 `…フィギュアとし | てその…` 从「として」中间劈开，
  # 于是 step4 把两个半句各自翻译完整 → "…同时注重这一点" / "同时也注重…" 重复。
  # 现在在 step3_1 与 step3_2 的出口用 spaCy token 边界校验，坏切点就地并回相邻行。
  merge_broken_lines: true

# * Summary length, set low to 2k if using local LLM
summary_length: 8000
max_workers: 1000
# 首次粗切的词数上限（spaCy token ≈ 词，同时作为 LLM 提示词里的 "each less than N words"）：
# 自动模式由语言档位表决定（中日 30 / 韩 28 / 拉丁 26 / 泰 20）；手动模式才读这里的值
max_split_length: 20
reflect_translate: true
pause_before_translate: false
min_trim_duration: 3.5
model_dir: './_model_cache'
allowed_video_formats:
- 'mp4'
- 'mov'
- 'avi'
- 'mkv'
- 'flv'
- 'wmv'
- 'webm'

allowed_audio_formats:
- 'wav'
- 'mp3'
- 'flac'
- 'm4a'

# 支持 response_format={"type":"json_object"} 的模型白名单（精确匹配 api.model）。
# 不在此列表中的模型不会传 response_format，此时完全依赖 json_repair 兜底解析 ——
# 能用，但遇到不合规输出时会走重试。换用新模型时记得把它加进来。
llm_support_json:
- 'deepseek-flash'
- 'deepseek/deepseek-v4-flash' # OpenRouter 命名风格（上游 3.x 的默认模型）
- 'deepseek-v4-pro'
- 'gpt-4o'
- 'gpt-4o-mini'
- 'qwen3-vl-flash' #0.15+1.5
- 'qwen-flash' #0.15+1.5
- 'qwen-plus' #0.8+2
- 'qwen3-max' #3.2+12.8
- 'qwen3:30b-a3b'

# have problems


# Spacy models
spacy_model_map:
  en: 'en_core_web_md'
  ru: 'ru_core_news_md'
  fr: 'fr_core_news_md'
  ja: 'ja_core_news_md'
  es: 'es_core_news_md'
  de: 'de_core_news_md'
  it: 'it_core_news_md'
  zh: 'zh_core_web_md'
  ko: 'ko_core_news_md'
  pt: 'pt_core_news_md'

# Languages that use space as separator
language_split_with_space:
- 'en'
- 'es'
- 'fr'
- 'de'
- 'it'
- 'ru'
- 'ko'
- 'pt'

# Languages that do not use space as separator
language_split_without_space:
- 'zh'
- 'ja'
speed_factor:
  max: 1.4
