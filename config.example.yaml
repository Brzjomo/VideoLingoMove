# ============================================================================
# VideoLingo 配置模板（config.example.yaml）
#
# 用法：本文件是提交进 git 的模板，**不含任何真实密钥**。
#   1. 首次运行时会自动复制为 config.yaml（见 core/config_utils.py 的 _read_config）
#      也可以手动：copy config.example.yaml config.yaml
#   2. config.yaml 已被 .gitignore 忽略，你的密钥不会进入版本库。
#
# 密钥也可以用环境变量提供，优先级高于本文件，这样连文件都不用改：
#   配置键 `api.key`          -> 环境变量 VIDEOLINGO_API_KEY
#   配置键 `volcano_asr.app_id` -> 环境变量 VIDEOLINGO_VOLCANO_ASR_APP_ID
#   （规则：前缀 VIDEOLINGO_ + 键路径中的非字母数字字符替换为下划线 + 全部大写）
#
# 另外，值里可以写 ${VAR} 引用环境变量，例如：
#   key: '${MY_LLM_KEY}'
# ============================================================================
# * Settings marked with * are advanced settings that won't appear in the Streamlit page and can only be modified manually in config.py
version: "2.1.2"
## ======================== Basic Settings ======================== ##
# API settings
api:
  key: 'YOUR_API_KEY'
  base_url: 'https://api.deepseek.com'
  model: 'deepseek-flash'

deepseek_api:
  key: 'YOUR_DEEPSEEK_API_KEY'
  base_url: 'https://api.deepseek.com'
  model: 'deepseek-flash'

qwen_api:
  key: 'YOUR_QWEN_API_KEY'
  base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
  model: 'qwen-plus'

siliconflow_api:
  key: 'YOUR_SILICONFLOW_API_KEY'
  base_url: 'https://api.siliconflow.cn'
  model: 'Qwen/Qwen2.5-72B-Instruct'

ollama_api:
  key: 'null'
  base_url: 'http://localhost:11434'
  model: 'qwen3:30b-a3b'

# Language settings, written into the prompt, can be described in natural language
target_language: '简体中文'

# Whether to perform transcription only (skip translation)
transcription_only: true

# ASR engine selection ["whisper", "volcano"]
asr_engine: 'whisper'

# Whether to use Demucs for vocal separation before transcription
demucs: false

whisper:
  # ["medium", "large-v3", "large-v3-turbo"]. Note: for zh model will force to use Belle/large-v3
  model: 'large-v3'
  # Whisper specified recognition language [en, zh, ...] (empty or 'auto' for automatic detection)
  language: 'zh'
  detected_language: 'zh'

# Volcano Engine ASR configuration
volcano_asr:
  # App ID from Volcano Engine console
  app_id: 'YOUR_VOLCANO_APP_ID'
  # Access token from Volcano Engine console
  access_token: 'YOUR_VOLCANO_ACCESS_TOKEN'
  # Resource ID, default: "volc.bigasr.auc"
  resource_id: 'volc.bigasr.auc'
  # Language code (optional, auto-detect if empty)
  # en-US, ja-JP, id-ID, es-MX, pt-BR, de-DE, fr-FR, ko-KR, fil-PH, ms-MY, th-TH, ar-SA
  language: 'zh-CN'
  # Enable punctuation
  enable_punc: false
  # Enable ITN (text normalization)
  enable_itn: true
  # Enable DDC (semantic smoothing)
  enable_ddc: true
  # Enable speaker info (speaker diarization)
  enable_speaker_info: false
  # Show utterances with timestamps
  show_utterances: true
  # Enable channel split for stereo audio
  enable_channel_split: false
  # Use VAD segmentation
  vad_segment: false
  # Model version: "310" (default) or "400" (improved performance)
  model_version: '400'

# TOS (Volcano Engine Object Storage) configuration
tos:
  # Access Key from Volcano Engine console
  access_key: 'YOUR_TOS_ACCESS_KEY'
  # Secret Key from Volcano Engine console
  secret_key: 'YOUR_TOS_SECRET_KEY'
  # Endpoint for TOS service
  endpoint: 'tos-cn-shanghai.volces.com'
  # Region for TOS service
  region: 'cn-shanghai'
  # Bucket name
  bucket_name: 'lingo'
  # Whether to enable TOS upload (if false, will use file:// URLs)
  enabled: true
  # Public URL prefix (auto-generated if empty)
  public_url_prefix: ''
  # Auto cleanup uploaded files after ASR completion
  auto_cleanup: true

# Video resolution [0x0, 640x360, 1920x1080]  0x0 will generate a 0-second black video placeholder
resolution: '0x0'

## ======================== Advanced Settings ======================== ##
# *Default resolution for downloading YouTube videos [360, 1080, best]
ytb_resolution: '1080'

subtitle:
  # *Maximum length of each subtitle line in characters
  max_length: 75
  # *Translated subtitles are slightly larger than source subtitles, affecting the reference length for subtitle splitting
  target_multiplier: 1.2
  # *字幕对齐兜底策略：warn=精确匹配失败时模糊兜底并告警（推荐）；strict=精确匹配失败即报错
  align_on_mismatch: warn

# * Summary length, set low to 2k if using local LLM
summary_length: 8000

# *Number of LLM multi-threaded accesses, set to 1 if using local LLM
max_workers: 1000
# *Maximum number of words for the first rough cut, below 18 will cut too finely affecting translation, above 22 is too long and will make subsequent subtitle splitting difficult to align
max_split_length: 20

# *Whether to reflect the translation result in the original text
reflect_translate: true

# *Whether to pause after extracting professional terms and before translation, allowing users to manually adjust the terminology table output\log\terminology.json
pause_before_translate: false

## ======================== Dubbing Settings ======================== ##
# TTS selection [sf_fish_tts, openai_tts, gpt_sovits, azure_tts, fish_tts, edge_tts, custom_tts]
min_trim_duration: 3.5 # Subtitles shorter than this value won't be split
model_dir: './_model_cache'

# Supported upload video formats
allowed_video_formats:
- 'mp4'
- 'mov'
- 'avi'
- 'mkv'
- 'flv'
- 'wmv'
- 'webm'

allowed_audio_formats:
- 'wav'
- 'mp3'
- 'flac'
- 'm4a'

# LLMs that support returning JSON format
llm_support_json:
- 'deepseek-flash'
- 'deepseek-v4-pro'
- 'gpt-4o'
- 'gpt-4o-mini'
- 'qwen3-vl-flash' #0.15+1.5
- 'qwen-flash' #0.15+1.5
- 'qwen-plus' #0.8+2
- 'qwen3-max' #3.2+12.8
- 'qwen3:30b-a3b'

# have problems


# Spacy models
spacy_model_map:
  en: 'en_core_web_md'
  ru: 'ru_core_news_md'
  fr: 'fr_core_news_md'
  ja: 'ja_core_news_md'
  es: 'es_core_news_md'
  de: 'de_core_news_md'
  it: 'it_core_news_md'
  zh: 'zh_core_web_md'
  ko: 'ko_core_news_md'
  pt: 'pt_core_news_md'

# Languages that use space as separator
language_split_with_space:
- 'en'
- 'es'
- 'fr'
- 'de'
- 'it'
- 'ru'
- 'ko'
- 'pt'

# Languages that do not use space as separator
language_split_without_space:
- 'zh'
- 'ja'
speed_factor:
  max: 1.4
